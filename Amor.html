    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    button {
      margin-top: 20px;
      background: #ff4081;
      color: white;
      border: none;
      padding: 15px 30px;

    @keyframes aparecer {

      to { opacity: 1; transform: translateY(0); }
    }

    /* ❤️ Corazones animados ❤️ */
    .corazon {
      position: fixed;
      bottom: 0;
      color: #ff5fa2;
      font-size: 24px;
      animation: subir 5s linear infinite;
      opacity: 0.8;
      z-index: 0;
    }
    @keyframes subir {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.8;
      }
      50% {
        opacity: 1;
        transform: translateY(-50vh) scale(1.3);
      }
      100% {
        transform: translateY(-100vh) scale(1);
        opacity: 0;
      }
    }
  </style>
</head>
